<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link href="css/localstorage.css" rel="stylesheet" />
  </head>
  <body>
    <main>
      <div class="main-content-wrapper">
        <h2>Anna tietoa niin tallennan ne paikalliselle koneelle</h2>
        <div class="input-container" id="input-container">
          <div class="input-field-container">
            <input
              type="text"
              class="storage-input"
              id="first-name"
              placeholder="Anna etunimi"
            />
          </div>
          <div class="input-field-container">
            <input
              type="text"
              class="storage-input"
              id="last-name"
              placeholder="Anna sukunimi"
            />
          </div>
          <div class="input-field-container">
            <input
              type="text"
              class="storage-input"
              id="address"
              placeholder="Anna osoite"
            />
          </div>
          <div class="input-field-container">
            <input
              type="text"
              class="storage-input"
              id="postcode"
              placeholder="Anna postinumero"
            />
          </div>
          <div class="input-field-container">
            <input
              type="text"
              id="post-area"
              class="storage-input"
              placeholder="Anna postitoimipaikka"
            />
          </div>
          <div class="input-field-container">
            <input
              type="text"
              class="storage-input"
              id="phone"
              placeholder="Anna puhelinnumero"
            />
          </div>
          <div class="input-button-container">
            <input
              type="text"
              class="storage-input"
              id="email"
              placeholder="Anna sähköposti"
            />
          </div>
          <div class="input-button-container">
            <button class="storage-button" id="save-storage-button">
              Save to Local Storage
            </button>
          </div>
          <div class="input-button-container">
            <button class="storage-button" id="load-storage-button">
              Load from Local Storage
            </button>
          </div>
          <div class="input-button-container">
            <button class="storage-button" id="clear-storage-button">
              Clear Local Storage
            </button>
          </div>
        </div>
      </div>
    </main>
  </body>
  <script src="js/localstorage.js"></script>
</html>
